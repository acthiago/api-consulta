apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-consulta-dividas
  namespace: api-consulta
  labels:
    app: api-consulta-dividas
spec:
  replicas: 1  # Número de réplicas para alta disponibilidade
  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause: {duration: 20}
      - setWeight: 60
      - pause: {duration: 30}
      - setWeight: 80
      - pause: {duration: 50}
  selector:
    matchLabels:
      app: api-consulta-dividas
  template:
    metadata:
      labels:
        app: api-consulta-dividas
    spec:
      containers:
      - name: api-consulta-dividas
        image: registry.digitalocean.com/poc-cobranca/poc-api-consulta:latest  # Substituir pela imagem do Docker Hub ou registry privado
        ports:
        - containerPort: 8000
        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: mongo_uri
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: secret_key
        - name: AUTHORIZATION_URL
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: authorization_url
        - name: TOKEN_URL
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: token_url
        resources:
          requests:
            memory: "100Mi"
            cpu: "250m"
          limits:
            memory: "200Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: api-consulta-dividas
  namespace: api-consulta
spec:
  selector:
    app: api-consulta-dividas
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP

